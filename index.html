<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集 | 科技應用與創意實作</title>
    <style>
        /* 基礎重置 */
        body, h1, p { margin: 0; padding: 0; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
        
        /* 標頭基礎結構 */
        header {
            height: 90vh; /* 佔據螢幕高度的 90% */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .main-title {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: 4px;
        }

        .sub-title {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">科技應用與創意實作</h1>
        <p class="sub-title">Exploring Technology & Creative Implementation</p>
    </header>

</body>
</html>
